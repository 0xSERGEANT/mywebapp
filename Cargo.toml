[package]
name = "mywebapp"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/0xSERGEANT/mywebapp"
authors = ["0xSERGEANT", "dirigeants"]
license = "WTFPL"

[dependencies]
axum   	= "0.8"
chrono 	= { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["yaml"] }
serde  	= { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sqlx   	= { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
tokio  	= { version = "1.0", features = ["full"] }
urlencoding = "2.1.3"