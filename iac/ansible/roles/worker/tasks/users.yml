---
- name: Create app system user (no login shell, runs the container)
  ansible.builtin.user:
    name: app
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create operator user
  ansible.builtin.user:
    name: operator
    shell: /bin/bash
    create_home: true
    password: "{{ vault_operator_password | password_hash('sha512') }}"
    update_password: on_create
