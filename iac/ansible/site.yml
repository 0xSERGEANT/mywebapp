---
- name: Preflight — wait for SSH and cloud-init
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.raw: cloud-init status --wait
      changed_when: false

- name: Gather facts from all hosts
  hosts: all
  gather_facts: true

- name: Common baseline (packages, users, gradebook)
  hosts: all
  become: true
  roles:
    - common

- name: Database server
  hosts: db
  become: true
  roles:
    - db

- name: Worker server
  hosts: worker
  become: true
  roles:
    - worker

- name: Verify deployment
  hosts: worker
  become: false
  roles:
    - verify
