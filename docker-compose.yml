networks:
  mywebapp_net:
    driver: bridge

volumes:
  pgdata:

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MYWEBAPP_DATABASE_USER}
      POSTGRES_PASSWORD: ${MYWEBAPP_DATABASE_PASSWORD}
      POSTGRES_DB: ${MYWEBAPP_DATABASE_NAME}
    ports:
      - "${DB_PORT_MAP}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mywebapp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MYWEBAPP_DATABASE_USER} -d ${MYWEBAPP_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      MYWEBAPP_DATABASE_HOST: ${MYWEBAPP_DATABASE_HOST}
      MYWEBAPP_DATABASE_PORT: ${MYWEBAPP_DATABASE_PORT}
      MYWEBAPP_DATABASE_DATABASE: ${MYWEBAPP_DATABASE_NAME}
      MYWEBAPP_DATABASE_USER: ${MYWEBAPP_DATABASE_USER}
      MYWEBAPP_DATABASE_PASSWORD: ${MYWEBAPP_DATABASE_PASSWORD}
      MYWEBAPP_SERVER_HOST: 0.0.0.0
      MYWEBAPP_SERVER_PORT: 5200
    ports:
      - "${APP_PORT_MAP}:5200"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mywebapp_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5200/health/alive"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT_MAP}:80"
    volumes:
      - ./deploy/nginx/mywebapp.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mywebapp_net
