name: ci-cd
run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/')
      && format('release [{0}]', github.ref_name)
      || format('ci-cd [{0}] — {1}', github.ref_name,
                github.event.head_commit.message
                || github.event.pull_request.title
                || 'manual') }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (clippy + hadolint + shellcheck + yamllint + actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: deploy/install.sh deploy/lib

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint .github/workflows \
            docker-compose.yml docker-compose.prod.yml

  test:
    name: test (cargo test + coverage ≥40%)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run tests with coverage
        run: |
          cargo tarpaulin \
            --fail-under 40 \
            --out Xml \
            --out Html \
            --output-dir coverage \
            --verbose

      - name: Upload coverage HTML (main + tags only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/tarpaulin-report.html
          retention-days: 30

      - name: Upload coverage XML (main + tags only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage/cobertura.xml
          retention-days: 30

  build:
    name: build (ghcr push)
    runs-on: ubuntu-24.04
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      GIT_REF: ${{ github.ref }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          OWNER_LC="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMG="ghcr.io/${OWNER_LC}/mywebapp"
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            TAG="${GIT_REF#refs/tags/}"
            TAGS="${IMG}:stable,${IMG}:${TAG}"
          else
            TAGS="${IMG}:latest,${IMG}:sha-${GIT_SHA}"
          fi
          {
            echo "owner_lc=$OWNER_LC"
            echo "image=$IMG"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Computed tags: $TAGS"

      - uses: docker/setup-buildx-action@v3

      - name: Docker login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.meta.outputs.owner_lc }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy (annotated tag only)
    runs-on: [self-hosted, vm-runner]
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      GIT_REF: ${{ github.ref }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Reject lightweight tags
        run: |
          TAG="${GIT_REF#refs/tags/}"
          git fetch --tags --force origin
          TYPE="$(git cat-file -t "refs/tags/$TAG")"
          if [[ "$TYPE" != "tag" ]]; then
            echo "::error::$TAG is a lightweight tag (type=$TYPE); use: git tag -a vX.Y.Z -m '...'"
            exit 1
          fi
          echo "Confirmed annotated tag: $TAG"

      - name: SSH deploy to target
        env:
          SSH_KEY: ${{ secrets.TARGET_SSH_KEY }}
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          TARGET_PORT: ${{ secrets.TARGET_PORT }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          TAG="${GIT_REF#refs/tags/}"
          IMAGE="ghcr.io/${OWNER_LC}/mywebapp:${TAG}"
          PORT="${TARGET_PORT:-22}"
          echo "Deploying $IMAGE → ${TARGET_HOST}:${PORT}"

          mkdir -p ~/.ssh
          install -m 0600 /dev/stdin ~/.ssh/deploy_key <<<"$SSH_KEY"
          ssh-keyscan -p "$PORT" -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new \
              "${TARGET_USER}@${TARGET_HOST}" \
              IMAGE="$IMAGE" OWNER_LC="$OWNER_LC" GHCR_TOKEN="${GHCR_TOKEN:-}" bash -se <<'REMOTE'
          set -euo pipefail
          sudo sed -i "s|^IMAGE=.*|IMAGE=${IMAGE}|" /opt/mywebapp/.env
          if [[ -n "${GHCR_TOKEN:-}" ]]; then
            printf '%s\n' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$OWNER_LC" --password-stdin
          fi
          sudo systemctl restart mywebapp-container.service
          sudo systemctl --no-pager status mywebapp-container.service | head -20
          REMOTE

  verify:
    name: verify (post-deploy)
    runs-on: [self-hosted, vm-runner]
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Wait for service to become ready
        env:
          TARGET: ${{ secrets.TARGET_HOST }}
          TARGET_HTTP_PORT: ${{ secrets.TARGET_HTTP_PORT }}
        run: |
          BASE="http://${TARGET}"
          [[ "${TARGET_HTTP_PORT:-80}" != "80" ]] && BASE="${BASE}:${TARGET_HTTP_PORT}"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "${BASE}/items" >/dev/null 2>&1; then
              echo "Service ready after ~$((i * 5))s"
              exit 0
            fi
            echo "Not ready yet (attempt ${i}/12)…"
            sleep 5
          done
          echo "::error::Service did not respond within 60s"
          exit 1

      - name: Run verify-deploy.sh
        env:
          TARGET: ${{ secrets.TARGET_HOST }}
          TARGET_HTTP_PORT: ${{ secrets.TARGET_HTTP_PORT }}
        run: |
          chmod +x scripts/verify-deploy.sh
          bash scripts/verify-deploy.sh
